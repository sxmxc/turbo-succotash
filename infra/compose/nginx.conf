map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 location = /healthz { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
 location = /identity/healthz { proxy_pass http://identity:3001/healthz; }
 location = /identity/readyz { proxy_pass http://identity:3001/readyz; }
 location /identity/ { proxy_pass http://identity:3001; proxy_set_header Host $host; }
 location /api/ { proxy_pass http://api:3002/; }
 location /realtime/ { proxy_pass http://realtime:3003/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 75s; }
 location / { try_files $uri $uri/ /index.html; }
}
