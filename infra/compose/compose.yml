name: panverse-plaza
x-build: &build
  context: ../..
  dockerfile: infra/Dockerfile
  args:
    BUILD_COMMIT: ${BUILD_COMMIT:-development}
    PRODUCT_VERSION: ${PRODUCT_VERSION:-development}
x-health: &health
  interval: 3s
  timeout: 5s
  retries: 20
  start_period: 10s
services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: social
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run env:init}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Run npm run env:init}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?Run npm run env:init}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      <<: *health
      test: [CMD-SHELL, "pg_isready -U postgres -d social"]
  migrate:
    image: ${MIGRATE_IMAGE:-panverse-plaza-migrate:dev}
    build:
      <<: *build
      target: migrate
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/social
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  identity:
    image: ${IDENTITY_IMAGE:-panverse-plaza-identity:dev}
    build:
      <<: *build
      target: identity
    environment:
      IDENTITY_DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD}@postgres:5432/social
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run npm run env:init}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?Run npm run env:init}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      <<: *health
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
  api:
    image: ${API_IMAGE:-panverse-plaza-api:dev}
    build:
      <<: *build
      target: api
    environment:
      API_DATABASE_URL: postgresql://application:${API_DB_PASSWORD}@postgres:5432/social
      IDENTITY_INTERNAL_URL: http://identity:3001
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      <<: *health
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3002/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
  realtime:
    image: ${REALTIME_IMAGE:-panverse-plaza-realtime:dev}
    build:
      <<: *build
      target: realtime
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in .env}
      API_INTERNAL_URL: http://api:3002
      IDENTITY_INTERNAL_URL: http://identity:3001
    depends_on:
      api: { condition: service_healthy }
      identity: { condition: service_healthy }
    healthcheck:
      <<: *health
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3003/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
  web:
    image: ${WEB_IMAGE:-panverse-plaza-web:dev}
    build:
      <<: *build
      target: web
    ports: ["${HOST:-127.0.0.1}:${WEB_PORT:-8080}:80"]
    depends_on:
      realtime: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: [CMD, wget, -q, --spider, http://127.0.0.1/healthz]
volumes:
  pgdata:
